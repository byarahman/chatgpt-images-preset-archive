name: Accessibility

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "404.html"
      - ".pa11yci.json"
      - ".github/workflows/accessibility.yml"

  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "404.html"
      - ".pa11yci.json"
      - ".github/workflows/accessibility.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessibility:
    name: WCAG accessibility audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Start local website
        run: |
          python3 -m http.server 8080 &
          sleep 2

      - name: Run accessibility audit
        run: npx --yes pa11y-ci@4.1.1
