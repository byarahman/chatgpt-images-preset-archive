<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0d0f12">
<meta name="robots" content="noindex">

<title>Page not found · ChatGPT Images Preset Archive</title>

<style>
:root{
  --bg:#0d0f12;
  --panel:#15181d;
  --text:#f5f7fa;
  --muted:#9aa3af;
  --line:#2a3038;
  --soft:#20252c;
  --green:#72d6a0;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(circle at 20% 10%,#1b2130 0,transparent 32%),
    radial-gradient(circle at 85% 80%,#18241f 0,transparent 28%),
    var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
main{
  min-height:100%;
  display:grid;
  place-items:center;
  padding:28px;
}
.card{
  width:min(720px,100%);
  padding:42px;
  border:1px solid var(--line);
  border-radius:28px;
  background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.018));
  box-shadow:0 24px 80px rgba(0,0,0,.3);
}
.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:8px 11px;
  border:1px solid var(--line);
  border-radius:999px;
  color:#c7ced7;
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 0 5px rgba(114,214,160,.1);
}
h1{
  margin:24px 0 14px;
  font-size:clamp(42px,8vw,82px);
  line-height:.95;
  letter-spacing:-.05em;
}
p{
  margin:0;
  color:var(--muted);
  font-size:17px;
  line-height:1.6;
}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:28px;
}
a{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:46px;
  padding:0 16px;
  border-radius:13px;
  border:1px solid var(--line);
  text-decoration:none;
  color:var(--text);
  font-weight:700;
  background:var(--panel);
}
a.primary{
  background:#f5f7fa;
  color:#101216;
  border-color:#f5f7fa;
}
a:hover{
  transform:translateY(-1px);
}
.code{
  margin-top:32px;
  padding-top:22px;
  border-top:1px solid var(--line);
  color:#727c88;
  font-size:13px;
}
@media(max-width:600px){
  .card{padding:28px}
  .actions{flex-direction:column}
  a{width:100%}
}
@media(prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important;transition:none!important}
}
</style>
</head>

<body>
<main>
  <section class="card">
    <div class="eyebrow">
      <span class="dot"></span>
      ChatGPT Images Preset Archive
    </div>

    <h1>404</h1>

    <p>
      This page doesn’t exist, may have moved, or the link may be outdated.
      You can return to the archive and continue exploring the preset library.
    </p>

    <div class="actions">
      <a class="primary" href="https://byarahman.github.io/chatgpt-images-preset-archive/">
        Return to archive
      </a>

      <a href="https://github.com/byarahman/chatgpt-images-preset-archive">
        View repository
      </a>
    </div>

    <div class="code">
      Error 404 · Page not found
    </div>
  </section>
</main>
</body>
</html>
